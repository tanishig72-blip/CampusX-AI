{% extends "base.html" %}{% block content %}
<h2>📚 Smart Library AI</h2><p class="text-muted">Search by title, author or subject.</p>
<form class="input-group mb-4"><input class="form-control" name="q" value="{{q}}" placeholder="Search AI, Python, DBMS..."><button class="btn btn-primary">Search</button></form>
<div class="row g-3">{% for b in rows %}<div class="col-md-6 col-lg-4"><div class="card h-100 border-0 shadow-sm"><div class="card-body"><span class="badge bg-light text-dark">{{b.category}}</span><h5 class="mt-2">{{b.title}}</h5><p class="text-muted">{{b.author}}</p>{% if b.available %}<span class="badge bg-success">Available</span>{% else %}<span class="badge bg-secondary">Issued</span>{% endif %}<form method="post" action="/library/{{b.id}}/toggle" class="mt-3"><button class="btn btn-sm btn-outline-primary">{% if b.available %}Issue Book{% else %}Mark Returned{% endif %}</button></form></div></div></div>{% endfor %}</div>
{% endblock %}
