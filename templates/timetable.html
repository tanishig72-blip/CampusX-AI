{% extends "base.html" %}{% block content %}
<h2>📅 Smart Timetable</h2><p class="text-muted">Demo timetable generated from subjects, rooms, faculty and time slots.</p>
<div class="row g-3">{% for r in rows %}<div class="col-md-6 col-lg-4"><div class="card schedule-card border-0 shadow-sm"><div class="card-body"><div class="d-flex justify-content-between"><span class="badge bg-primary">{{r.day}}</span><small>{{r.time}}</small></div><h5 class="mt-3">{{r.subject}}</h5><p class="mb-1">📍 {{r.room}}</p><p class="text-muted mb-0">👨‍🏫 {{r.faculty}}</p></div></div></div>{% endfor %}</div>
{% endblock %}
