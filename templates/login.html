<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusX AI Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"></head>
<body class="login-bg"><div class="container"><div class="row justify-content-center align-items-center vh-100"><div class="col-md-5">
<div class="card shadow-lg border-0 p-4"><div class="text-center mb-3"><div class="logo">⚡</div><h1 class="fw-bold">CampusX AI</h1><p class="text-muted">Intelligent Digital Campus Platform</p></div>
{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="alert alert-danger">{{m}}</div>{% endfor %}{% endwith %}
<form method="post" action="/login">
<label class="form-label">Email</label><input class="form-control mb-3" name="email" value="student@campusx.ai" required>
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" value="1234" required>
<button class="btn btn-primary w-100 py-2">Login to CampusX</button></form>
<div class="mt-4 small text-muted"><b>Student:</b> student@campusx.ai / 1234<br><b>Admin:</b> admin@campusx.ai / admin123</div>
</div></div></div></div></body></html>
